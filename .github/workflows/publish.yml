name: Publish Package

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version already published
        id: version-check
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          PACKAGE_VERSION=$(jq -r .version package.json)
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          # Query GitHub Packages explicitly. Without --registry, npm view
          # falls through to the default registry written by
          # actions/setup-node (which sets npmjs.org as the global registry
          # via its registry-url input, even when a scoped registry rule
          # exists in the project .npmrc). On npmjs.org the package doesn't
          # exist, so the check always reported "not found" and the publish
          # step would try to publish — failing with E409 on every push
          # that didn't bump the version. Pinning --registry forces
          # GitHub Packages, so version-skip detection actually works.
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PACKAGE_VERSION} already published, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PACKAGE_VERSION} not found, will publish."
          fi
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.version-check.outputs.exists == 'false'
        run: pnpm build

      - name: Publish to GitHub Packages
        if: steps.version-check.outputs.exists == 'false'
        run: pnpm publish --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Vercel rebuild
        if: steps.version-check.outputs.exists == 'false'
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
