name: Publish Package

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      # Publish, treating E409 ("Cannot publish over existing version") as a
      # successful no-op. The previous design used `npm view` to pre-check
      # whether the version was already published and skip the publish step
      # accordingly — but that read against GitHub Packages was unreliable
      # (returns 404 even with --registry pinned and matching auth, possibly
      # a quirk of the GitHub Packages npm-API), so the check always said
      # "not published" and we'd hit E409 every time the version hadn't been
      # bumped. Letting the publish step BE the truth is more robust: if the
      # registry says the version exists, we accept that and skip downstream
      # work; any other error propagates.
      - name: Publish to GitHub Packages
        id: publish
        run: |
          set +e
          output=$(pnpm publish --no-git-checks 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$output" | grep -q "Cannot publish over existing version"; then
            echo "::notice::Version already published on GitHub Packages — treating as no-op."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any other publish failure should fail the workflow.
          exit "$status"
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Vercel rebuild
        if: steps.publish.outputs.published == 'true'
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
