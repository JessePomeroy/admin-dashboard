name: Publish Package

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://npm.pkg.github.com"
          package-manager-cache: false
          token: ""

      - run: corepack enable

      - run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm build

      # Publish, treating the registry's existing-version errors as a
      # successful no-op. The previous design used `npm view` to pre-check
      # whether the version was already published and skip the publish step
      # accordingly — but that read against GitHub Packages was unreliable
      # (returns 404 even with --registry pinned and matching auth, possibly
      # a quirk of the GitHub Packages npm-API), so the check always said
      # "not published" and we'd hit E409 every time the version hadn't been
      # bumped. Letting the publish step BE the truth is more robust: if the
      # registry says the version exists, we accept that and skip downstream
      # work; any other error propagates.
      - name: Publish to GitHub Packages
        id: publish
        run: |
          set +e
          output=$(corepack pnpm publish --no-git-checks 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$output" | grep -Eqi "cannot publish over (existing version|the previously published versions)"; then
            echo "::notice::Version already published on GitHub Packages — treating as no-op."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any other publish failure should fail the workflow.
          exit "$status"
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Vercel rebuild
        if: steps.publish.outputs.published == 'true'
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
