name: Release package

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-admin-package
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  # Browser-dependent verification runs in the pinned Playwright image. The
  # release job below needs no browser and runs only after this job passes.
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
    permissions:
      contents: read
    # Container steps otherwise run under dash; the scripts use bash syntax.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The container runs as root against a runner-owned checkout; git refuses
      # that workspace unless it is trusted for this job's HOME.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          registry-url: "https://npm.pkg.github.com"
          scope: "@jessepomeroy"
          package-manager-cache: false
          token: ""

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      # The container supplies browsers and their system libraries, so no apt
      # mirror is contacted. Bump the image tag and digest with Playwright.
      - name: Match the Playwright package to the container browsers
        run: test "$(node -p "require('playwright/package.json').version")" = "1.59.1"
      - run: corepack pnpm lint
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm check:server-entrypoints

  release:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          registry-url: "https://npm.pkg.github.com"
          scope: "@jessepomeroy"
          package-manager-cache: false
          token: ""

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: corepack pnpm build

      # Pending changesets produce a reviewable version PR. Publication occurs
      # only after that separate PR is approved and merged.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: corepack pnpm changeset version
          publish: corepack pnpm changeset publish
          commit: "chore(admin): version package"
          title: "chore(admin): version package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI on the version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"
