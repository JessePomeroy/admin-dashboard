name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://npm.pkg.github.com"
          package-manager-cache: false
          token: ""
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Require a changeset for public package changes
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          changed=$(git diff --name-only origin/main...HEAD)
          base_version=$(git show origin/main:package.json | node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => process.stdout.write(JSON.parse(s).version))")
          head_version=$(node -p "require('./package.json').version")
          release_pr=false
          if [ "$GITHUB_HEAD_REF" = 'changeset-release/main' ] && { [ "$PR_AUTHOR" = 'github-actions[bot]' ] || [ "$PR_AUTHOR" = 'JessePomeroy' ]; }; then release_pr=true; fi
          if [ "$base_version" != "$head_version" ] && [ "$release_pr" != true ]; then
            echo 'Direct package version changes are reserved for the Changesets release PR.'
            exit 1
          fi
          if grep -Eq '^(src/lib/|package.json$)' <<<"$changed" && [ "$release_pr" != true ]; then
            added=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' | grep -v '/README.md$' || true)
            test -n "$added" || { echo 'Public package changes require a new .changeset/*.md file.'; exit 1; }
            corepack pnpm changeset status --since=origin/main --output=/tmp/changeset-status.json
            node -e "const s=require('/tmp/changeset-status.json'); if (!s.releases.some(r => r.name === '@jessepomeroy/admin')) process.exit(1)"
          fi
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build
